name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Check formatting
              run: yarn format:check

            - name: Lint source
              run: yarn lint

            - name: Check types
              run: yarn typecheck

            - name: Run tests
              run: yarn test

            - name: Build package
              run: yarn build

            - name: Smoke test package
              run: yarn smoke:package
